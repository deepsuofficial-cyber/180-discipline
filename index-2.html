<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080a0f"><link rel="manifest" href="manifest.webmanifest"><title>180 Day Discipline</title><style>
:root{--b:#080a0f;--p:#111722;--l:#263041;--t:#f5f7fa;--m:#8b96a8;--a:#b8ff00}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:Arial,sans-serif}.hide{display:none!important}.welcome{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.welcome h1{font-size:32px}.welcome p{color:var(--m)}button{border:0;border-radius:13px;padding:13px 16px;font-weight:800}.enter,.primary{background:var(--a);color:#071000}.enter{width:100%;margin-top:20px}.app{max-width:720px;margin:auto;padding:18px 15px 90px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:900}.sub,.small{font-size:11px;color:var(--m);margin-top:4px}.pill{background:var(--p);border:1px solid var(--l);padding:8px 11px;border-radius:20px;font-size:12px}.page{display:none}.page.on{display:block}.card{background:var(--p);border:1px solid var(--l);border-radius:18px;padding:17px;margin-bottom:13px}.hero h1{font-size:28px;margin:0}.quote{font-size:17px;font-weight:900;font-style:italic;margin:15px 0}.meta{display:flex;justify-content:space-between;color:var(--m);font-size:11px}.barbg{height:9px;background:#222b38;border-radius:20px;margin-top:7px}.bar{height:100%;background:var(--a);width:0;border-radius:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.check{display:flex;gap:10px;align-items:center;background:#0d121b;border:1px solid var(--l);padding:14px;border-radius:13px;font-weight:800}.check.done{border-color:#6d9000}.check input{width:20px;height:20px;accent-color:var(--a)}textarea,input{width:100%;background:#0a0f16;color:var(--t);border:1px solid var(--l);border-radius:12px;padding:12px}.primary{width:100%;margin-top:11px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#0d121b;border:1px solid var(--l);border-radius:13px;padding:13px}.num{font-size:23px;font-weight:900}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{padding:9px 2px;background:#1a212d;color:#9ba5b5;border-radius:9px;font-size:10px}.day.done{background:var(--a);color:#071000}.day.today{outline:2px solid white}.note{padding:12px;border:1px solid var(--l);border-radius:12px;background:#0d121b;margin-top:8px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0b0f16f2;border-top:1px solid var(--l);padding-bottom:env(safe-area-inset-bottom)}.nav{max-width:720px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);padding:7px 10px}.nav button{background:none;color:var(--m)}.nav button.on{color:var(--a)}@media(max-width:430px){.grid{grid-template-columns:1fr}}
</style></head><body>
<section id="welcome" class="welcome"><div><h1>WELCOME DEEPSU</h1><p>180 DAY DISCIPLINE</p><button class="enter" onclick="enter()">ENTER</button></div></section>
<section id="app" class="hide"><div class="app"><div class="top"><div><div class="brand">180 DAY DISCIPLINE</div><div class="sub">10 AUG 2026 → 05 FEB 2027</div></div><div class="pill" id="pill">DAY 1</div></div>
<main id="home" class="page on"><div class="card hero"><h1 id="hd">DAY 1</h1><div class="sub" id="date"></div><div class="quote">“NO EXCUSES. JUST EXECUTE.”</div><div class="meta"><span>180 DAY PROGRESS</span><span id="pt">0 / 180</span></div><div class="barbg"><div class="bar" id="bar"></div></div></div><div class="stats"><div class="stat"><div class="small">CURRENT STREAK</div><div class="num" id="cur">0</div></div><div class="stat"><div class="small">BEST STREAK</div><div class="num" id="best">0</div></div></div><div class="card"><b>TODAY</b><p class="small" id="status">Your page is ready.</p><button class="primary" onclick="show('tracker')">OPEN TODAY'S TRACKER →</button></div></main>
<main id="tracker" class="page"><div class="card"><h1 id="td">DAY 1</h1><div class="sub" id="tdate"></div></div><div class="card"><b>BODY · MIND · SKILL · YOUTUBE</b><div class="grid" style="margin-top:12px"><label class="check"><input type="checkbox" data-k="body">BODY</label><label class="check"><input type="checkbox" data-k="mind">MIND</label><label class="check"><input type="checkbox" data-k="skill">SKILL</label><label class="check"><input type="checkbox" data-k="youtube">YOUTUBE</label></div><button class="primary" onclick="complete()">COMPLETE DAY</button></div><div class="card"><b>TODAY'S WIN</b><textarea id="win" rows="3" placeholder="Aaj kya complete kiya?"></textarea></div><div class="card"><b>180-DAY PAGES</b><div class="days" id="days" style="margin-top:12px"></div></div></main>
<main id="notes" class="page"><div class="card"><h1>NOTES</h1><div class="small">Kuch bhi note karo.</div></div><div class="card"><div style="display:flex;gap:8px"><input id="ni" placeholder="Write a note..."><button class="primary" style="width:auto;margin:0" onclick="addNote()">ADD</button></div><div id="nl"></div></div></main>
</div><div class="bottom"><nav class="nav"><button class="on" data-p="home" onclick="show('home')">⌂<br>HOME</button><button data-p="tracker" onclick="show('tracker')">✓<br>TRACKER</button><button data-p="notes" onclick="show('notes')">✎<br>NOTE</button></nav></div></section>
<script>
const S=new Date('2026-08-10T00:00:00'),N=180,K='d180v3',NK='d180notes';let D=JSON.parse(localStorage.getItem(K)||'{}'),NS=JSON.parse(localStorage.getItem(NK)||'[]');let A=Math.max(0,Math.min(N-1,Math.floor((new Date()-S)/86400000)));function blank(){return{body:false,mind:false,skill:false,youtube:false,win:'',complete:false}}function d(i){if(!D[i])D[i]=blank();return D[i]}function save(){localStorage.setItem(K,JSON.stringify(D))}function dt(i){let x=new Date(S);x.setDate(x.getDate()+i);return x}function f(x){return x.toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric'})}function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id==id));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x.dataset.p==id));render()}function enter(){welcome.classList.add('hide');app.classList.remove('hide');render()}function count(){return Object.values(D).filter(x=>x.complete).length}function streak(){let b=0,r=0;for(let i=0;i<N;i++){if(D[i]?.complete){r++;b=Math.max(b,r)}else r=0}return b}function render(){let x=d(A),c=count();pill.textContent='DAY '+(A+1);hd.textContent='DAY '+(A+1);td.textContent='DAY '+(A+1);date.textContent=f(dt(A));tdate.textContent=f(dt(A));pt.textContent=c+' / '+N;bar.style.width=(c/N*100)+'%';best.textContent=streak();let r=0;for(let i=N-1;i>=0&&D[i]?.complete;i--)r++;cur.textContent=r;status.textContent=x.complete?'DAY '+(A+1)+' COMPLETE ✓':'Your Day '+(A+1)+' page is ready.';win.value=x.win||'';document.querySelectorAll('[data-k]').forEach(q=>{q.checked=!!x[q.dataset.k];q.parentElement.classList.toggle('done',q.checked)});days.innerHTML='';for(let i=0;i<N;i++){let q=document.createElement('button');q.className='day '+(D[i]?.complete?'done ':'')+(i==A?'today':'');q.textContent=i+1;q.onclick=()=>{A=i;show('tracker')};days.appendChild(q)}nl.innerHTML=NS.map(x=>'<div class="note">'+escapeHtml(x)+'</div>').join('')||'<div class="small">No notes yet.</div>'}function complete(){let x=d(A);x.body=x.mind=x.skill=x.youtube=true;x.complete=true;save();render()}document.querySelectorAll('[data-k]').forEach(q=>q.onchange=e=>{let x=d(A);x[e.target.dataset.k]=e.target.checked;x.complete=x.body&&x.mind&&x.skill&&x.youtube;save();render()});win.oninput=e=>{d(A).win=e.target.value;save()};function addNote(){let v=ni.value.trim();if(v){NS.unshift(v);localStorage.setItem(NK,JSON.stringify(NS));ni.value='';render()}}function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
</script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})</script></body></html>
