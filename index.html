<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>180 Day Discipline</title><link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#080a0f;--card:#121722;--card2:#0d1119;--text:#f5f7fa;--muted:#8e98a8;--accent:#b8ff00;--line:#252d3a;--danger:#ff5d73}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
.app{max-width:760px;margin:auto;padding:18px 16px 90px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.brand{font-weight:800;letter-spacing:.5px}.sub{font-size:11px;color:var(--muted);margin-top:4px}
.badge{background:#151c28;border:1px solid #263042;border-radius:20px;padding:9px 12px;font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.hero{background:linear-gradient(145deg,#151b28,#0d1119)}h1{font-size:28px;margin:0 0 7px}h2{font-size:15px;margin:0 0 14px}.quote{font-size:18px;font-weight:800;font-style:italic;margin:10px 0 18px}
.progress{height:9px;background:#222b38;border-radius:20px;overflow:hidden}.bar{height:100%;width:0;background:var(--accent);transition:.25s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin:8px 0 7px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.check{display:flex;align-items:center;gap:11px;background:var(--card2);border:1px solid var(--line);padding:15px;border-radius:13px;cursor:pointer;font-weight:700}
.check input{width:20px;height:20px;accent-color:var(--accent)}.check.done{border-color:#668a00;background:#151d13}
button{border:0;border-radius:12px;padding:13px 16px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:#071000;width:100%;margin-top:13px}.secondary{background:#202735;color:var(--text)}
.win{width:100%;background:#0c1017;border:1px solid var(--line);color:var(--text);padding:13px;border-radius:12px;outline:none;font-size:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px}.num{font-size:24px;font-weight:900;margin-top:4px}.label{font-size:11px;color:var(--muted)}
.history{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}.day{aspect-ratio:1;border-radius:6px;background:#1b2230;border:1px solid #273040;display:flex;align-items:center;justify-content:center;font-size:9px;color:#9ba5b5}.day.done{background:var(--accent);color:#071000;border-color:var(--accent);font-weight:900}.day.today{outline:2px solid white;outline-offset:1px}
.footer{position:fixed;bottom:0;left:0;right:0;background:#0b0e14ee;backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px;text-align:center}
.small{font-size:11px;color:var(--muted)}@media(max-width:500px){.app{padding:14px 12px 80px}.grid{grid-template-columns:1fr}.history{grid-template-columns:repeat(10,1fr)}h1{font-size:24px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><div class="brand">180 DAY DISCIPLINE</div><div class="sub">10 AUG 2026 → 05 FEB 2027</div></div>
    <div class="badge" id="dayBadge">DAY 1 / 180</div>
  </div>

  <div class="card hero">
    <h1 id="dayTitle">DAY 1</h1>
    <div class="sub" id="dateText">10 August 2026</div>
    <div class="quote">“NO EXCUSES. JUST EXECUTE.”</div>
    <div class="meta"><span>TOTAL PROGRESS</span><span id="progressText">0 / 180 days</span></div>
    <div class="progress"><div class="bar" id="progressBar"></div></div>
  </div>

  <div class="card">
    <h2>TODAY'S CHECKLIST</h2>
    <div class="grid">
      <label class="check" id="cBody"><input type="checkbox" data-key="body"> BODY</label>
      <label class="check" id="cMind"><input type="checkbox" data-key="mind"> MIND</label>
      <label class="check" id="cSkill"><input type="checkbox" data-key="skill"> SKILL</label>
      <label class="check" id="cYoutube"><input type="checkbox" data-key="youtube"> YOUTUBE</label>
    </div>
    <button class="primary" id="completeBtn">COMPLETE DAY</button>
  </div>

  <div class="card">
    <h2>TODAY'S WIN</h2>
    <textarea class="win" id="win" rows="2" placeholder="Aaj kya complete kiya?"></textarea>
  </div>

  <div class="stats">
    <div class="stat"><div class="label">CURRENT STREAK</div><div class="num" id="currentStreak">0</div><div class="small">days</div></div>
    <div class="stat"><div class="label">BEST STREAK</div><div class="num" id="bestStreak">0</div><div class="small">days</div></div>
  </div>

  <div class="card">
    <h2>180-DAY HISTORY</h2>
    <div class="history" id="history"></div>
  </div>

  <div class="card">
    <h2>RESET</h2>
    <button class="secondary" id="resetBtn">Reset all progress</button>
    <div class="small" style="margin-top:8px">Data isi browser mein save hota hai.</div>
  </div>
</div>
<div class="footer"><span id="footerStatus">DAY 1 — KEEP GOING</span></div>

<script>
const START = new Date('2026-08-10T00:00:00');
const END = new Date('2027-02-05T23:59:59');
const TOTAL = 180;
const KEY = 'discipline180_v1';

function blank(){return {body:false,mind:false,skill:false,youtube:false,win:'',complete:false};}
let data = JSON.parse(localStorage.getItem(KEY) || '{}');
function save(){localStorage.setItem(KEY,JSON.stringify(data));}
function dateFor(i){let d=new Date(START);d.setDate(d.getDate()+i);return d;}
function currentIndex(){
  const now=new Date(); if(now<START)return 0; if(now>END)return TOTAL-1;
  return Math.floor((now-START)/86400000);
}
let active = currentIndex();

function dayData(i){if(!data[i])data[i]=blank();return data[i];}
function completedCount(){return Array.from({length:TOTAL},(_,i)=>data[i]?.complete).filter(Boolean).length;}
function streaks(){
  let best=0,run=0;
  for(let i=0;i<TOTAL;i++){if(data[i]?.complete){run++;best=Math.max(best,run)}else run=0}
  let cur=0;
  for(let i=TOTAL-1;i>=0;i--){if(data[i]?.complete)cur++;else break}
  return {best,cur};
}
function fmt(d){return d.toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric'});}
function render(){
  const d=dayData(active), date=dateFor(active), done=completedCount(), s=streaks();
  document.getElementById('dayTitle').textContent=`DAY ${active+1}`;
  document.getElementById('dayBadge').textContent=`DAY ${active+1} / ${TOTAL}`;
  document.getElementById('dateText').textContent=fmt(date);
  document.getElementById('progressText').textContent=`${done} / ${TOTAL} days (${Math.round(done/TOTAL*100)}%)`;
  document.getElementById('progressBar').style.width=(done/TOTAL*100)+'%';
  document.getElementById('currentStreak').textContent=s.cur;
  document.getElementById('bestStreak').textContent=s.best;
  document.getElementById('win').value=d.win||'';
  document.querySelectorAll('[data-key]').forEach(x=>{x.checked=!!d[x.dataset.key];x.closest('.check').classList.toggle('done',x.checked)});
  document.getElementById('completeBtn').textContent=d.complete?'DAY COMPLETE ✓':'COMPLETE DAY';
  document.getElementById('footerStatus').textContent=d.complete?`DAY ${active+1} COMPLETE ✓`:`DAY ${active+1} — KEEP GOING`;
  const h=document.getElementById('history');h.innerHTML='';
  for(let i=0;i<TOTAL;i++){
    const el=document.createElement('div');el.className='day'+(data[i]?.complete?' done':'')+(i===active?' today':'');el.textContent=i+1;
    el.title=`Day ${i+1} — ${fmt(dateFor(i))}`;el.onclick=()=>{active=i;render();window.scrollTo({top:0,behavior:'smooth'})};h.appendChild(el);
  }
}
document.querySelectorAll('[data-key]').forEach(x=>x.addEventListener('change',e=>{
  dayData(active)[e.target.dataset.key]=e.target.checked;
  const d=dayData(active); d.complete=!!(d.body&&d.mind&&d.skill&&d.youtube);
  save();render();
}));
document.getElementById('win').addEventListener('input',e=>{dayData(active).win=e.target.value;save();});
document.getElementById('completeBtn').onclick=()=>{
  const d=dayData(active);
  d.body=d.mind=d.skill=d.youtube=true;d.complete=true;save();render();
};
document.getElementById('resetBtn').onclick=()=>{
  if(confirm('Reset ALL 180-day progress? This cannot be undone.')){data={};save();render();}
};
render();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(()=>{});}</script></body>
</html>
